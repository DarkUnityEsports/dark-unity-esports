<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        :root {
            --bg-deep: #0b0f19;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(11, 15, 25, 0.50), rgba(11, 15, 25, 0.65)),
                url('FONDO-MARCADOR.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-white);
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #1e293b;
            margin-bottom: 30px;
        }
        header h2 {
            color: #00e5ff;
            font-size: 1.7rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        @media (min-width: 768px) {
            header h2 { font-size: 2.5rem; letter-spacing: 2px; }
        }
        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        @media (min-width: 768px) {
            header p { font-size: 1.1rem; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* 🆕 Navegación: 3 botones en una línea */
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            margin-bottom: 15px;
            justify-content: center;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .nav-buttons::-webkit-scrollbar { display: none; }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            background: #1f2937;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s, color 0.3s;

            white-space: nowrap;
            flex-shrink: 0;

        .btn-download-all {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #f1c40f;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;

            white-space: nowrap;

        .btn-download-all:disabled { opacity: 0.7; cursor: wait; }
        .btn-download-all .texto-largo { display: none; }
        .btn-download-all .texto-corto { display: inline; }

        @media (min-width: 600px) {
            .nav-buttons { flex-wrap: wrap; }

            .btn-download-all .texto-largo { display: inline; }
            .btn-download-all .texto-corto { display: none; }

        /* Estilos por Categoría */
        .categoria-section {
            margin-bottom: 45px;
            position: relative;
        }

        .categoria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .categoria-titulo {
            color: #ffffff;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid #00e5ff;
            padding-left: 10px;
            margin: 0;
        }

        /* 🆕 Contenedor fecha + botón en la misma línea */
        .date-and-btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .btn-capture-cat {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #f1c40f;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-capture-cat:hover { background: #d4ac0d; }
        .btn-capture-cat:disabled { opacity: 0.7; cursor: wait; }

        .ranking-dates {
            margin-bottom: 10px;
            text-align: left;
            display: none;
        }
        .date-badge {
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: #00e5ff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .tabla-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);

        table {

        th, td {
            padding: 14px 16px;

        th.posicion, td.posicion {

        th.col-equipo, td.col-equipo { width: 38%; color: #ffffff; }
        th.col-juegos, td.col-juegos { width: 14%; text-align: center; color: #00e5ff; }

        th.col-jp, td.col-jp { width: 14%; text-align: center; color: #ef4444; }
        th.col-puntos, td.col-puntos { width: 20%; text-align: right; }

        th {

            letter-spacing: 1px;
        }
        tr:not(:last-child) td { border-bottom: 1px solid #1f2937; }
        tr:hover { background-color: rgba(0, 229, 255, 0.05); }

        .top-1 { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .top-2 { color: #c0c0c0 !important; }
        .top-3 { color: #cd7f32 !important; }
    </style>
</head>
<body>

    <script>
        const APIS_SHEETDB = [
            "https://sheetdb.io/api/v1/bl39mzkh3q49q", //carlewistaker@gmail.com - limite 500 peticiones mensuales
            "https://sheetdb.io/api/v1/g9grt37d3tjxp", //carlewiscortez84@gmail.com - limite 500 peticiones mensuales
            "https://sheetdb.io/api/v1/ykytq9d0i7we0", //carlewiscortez44@gmail.com - limite 500 peticiones mensuales
            "https://sheetdb.io/api/v1/p7oxuv1tkymxo", //soportepcvenezuela1@gmail.com - limite 500 peticiones mensaueles
            "https://sheetdb.io/api/v1/4fnmphnj100qq", //cortezcarlewis076@gmail.com - limite 500 peticiones mensaueles
            "https://sheetdb.io/api/v1/pstmhlvzvjwwp", //carlewiscortez911@gmail.com - limite 500 peticviones mensuales
        ];

        // ═══════════════════════════════════════════════════
        // CARGA DE DATOS
        // ═══════════════════════════════════════════════════
        async function cargarRankingDinamico() {
            let datos = null;
            const urlsMezcladas = [...APIS_SHEETDB].sort(() => Math.random() - 0.5);

            for (let i = 0; i < urlsMezcladas.length; i++) {
                try {
                    const respuesta = await fetch(urlsMezcladas[i]);
                    if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);
                    const json = await respuesta.json();
                    if (Array.isArray(json) && json.length > 0) {
                        datos = json;
                        break;
                    }
                } catch (error) {
                    console.warn(`La API #${i + 1} falló. Probando siguiente...`);
                }
            }

            if (!datos) {
                console.error("No se pudo conectar a ninguna API.");
                ['rocky', 'beginner', 'master'].forEach(cat => {
                    const tbody = document.getElementById('cuerpo-' + cat);
                    if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ef4444;">Error al cargar los datos</td></tr>';
                });
                return;
            }

            let htmlRocky = "", htmlBeginner = "", htmlMaster = "";
            let fechaRocky = "", fechaBeginner = "", fechaMaster = "";

            datos.forEach((fila) => {
                let cat = (fila.category || "").toLowerCase().trim();
                let pos = fila.pos || "";
                let teamName = fila.teamName || "";
                let games = fila.games || "0";
                let won = fila.won || "0";
                let lost = fila.lost || "0";
                let points = fila.points || "0";
                let dateInfo = fila.dateInfo || "";

                if (dateInfo) {
                    if ((cat === "rookie" || cat === "rocky") && !fechaRocky) fechaRocky = dateInfo;
                    if (cat === "beginner" && !fechaBeginner) fechaBeginner = dateInfo;
                    if (cat === "master" && !fechaMaster) fechaMaster = dateInfo;
                }

                if (!teamName) return;

                let clasePos = "";
                let posLower = pos.toString().trim();
                if (posLower === "#1" || posLower === "1") clasePos = "posicion top-1";
                else if (posLower === "#2" || posLower === "2") clasePos = "posicion top-2";
                else if (posLower === "#3" || posLower === "3") clasePos = "posicion top-3";
                else clasePos = "posicion";

                let filaHTML = `
                    <tr>
                        <td class="${clasePos}">${pos}</td>
                        <td class="col-equipo"><strong>${teamName}</strong></td>
                        <td class="col-juegos">${games}</td>
                        <td class="col-jg">${won}</td>
                        <td class="col-jp">${lost}</td>
                        <td class="col-puntos" style="color: #00e5ff; font-weight: bold;">${points} pts</td>
                    </tr>
                `;

                if (cat === "rookie" || cat === "rocky") htmlRocky += filaHTML;
                else if (cat === "beginner") htmlBeginner += filaHTML;
                else if (cat === "master") htmlMaster += filaHTML;
            });

            const cuerpoRocky = document.getElementById("cuerpo-rocky");
            const cuerpoBeginner = document.getElementById("cuerpo-beginner");
            const cuerpoMaster = document.getElementById("cuerpo-master");

            if (cuerpoRocky) cuerpoRocky.innerHTML = htmlRocky || `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No hay equipos registrados</td></tr>`;
            if (cuerpoBeginner) cuerpoBeginner.innerHTML = htmlBeginner || `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No hay equipos registrados</td></tr>`;
            if (cuerpoMaster) cuerpoMaster.innerHTML = htmlMaster || `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No hay equipos registrados</td></tr>`;

            // 🔑 Siempre mostrar el bloque (fecha + botón), incluso si no hay fecha
            mostrarBloqueFecha('rocky', fechaRocky);
            mostrarBloqueFecha('beginner', fechaBeginner);
            mostrarBloqueFecha('master', fechaMaster);
        }

        // 🔑 Función auxiliar: siempre muestra el bloque con fecha y botón
        function mostrarBloqueFecha(catId, textoFecha) {
            const wrapper = document.getElementById('wrapper-fecha-' + catId);
            const texto = document.getElementById('texto-fecha-' + catId);
            if (wrapper) {
                wrapper.style.display = 'block';
                if (texto) {
                    texto.textContent = textoFecha || 'Sin fecha';
                }
            }
        }

        // ═══════════════════════════════════════════════════
        // CAPTURA HD
        // ═══════════════════════════════════════════════════
        function urlABase64(url) {
            return new Promise((resolve, reject) => {
                const intentar = (conCORS) => {
                    const img = new Image();
                    if (conCORS) img.crossOrigin = 'anonymous';
                    img.onload = function () {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.naturalWidth;
                            canvas.height = img.naturalHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            resolve(canvas.toDataURL('image/png'));
                        } catch (e) {
                            if (conCORS) intentar(false);
                            else reject(e);
                        }
                    };
                    img.onerror = function () {
                        if (conCORS) intentar(false);
                        else reject(new Error('No se pudo cargar: ' + url));
                    };
                    img.src = url;
                };
                intentar(true);
            });
        }

        async function prepararClon(elemento, anchoReal) {
            const clon = elemento.cloneNode(true);

            // 🔑 Quitar el botón de captura del clon
            const btnCopia = clon.querySelector('.btn-capture-cat');
            if (btnCopia) btnCopia.remove();

            // Fondo Base64
            try {
                const bgBase64 = await urlABase64('FONDO-MARCADOR.jpg');
                clon.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.50), rgba(11, 15, 25, 0.65)), url('${bgBase64}')`;
                clon.style.backgroundSize = 'cover';
                clon.style.backgroundPosition = 'center';
                clon.style.backgroundRepeat = 'no-repeat';
            } catch (e) {
                console.warn('No se pudo convertir el fondo:', e);
            }

            // Expandir tablas
            clon.querySelectorAll('.tabla-container').forEach(tc => {
                tc.style.overflow = 'visible';
                tc.style.overflowX = 'visible';
            });
            clon.querySelectorAll('table').forEach(t => {
                t.style.minWidth = 'auto';
                t.style.width = '100%';
            });

            clon.style.position = 'fixed';
            clon.style.left = '-99999px';
            clon.style.top = '0';
            clon.style.width = anchoReal + 'px';
            clon.style.minWidth = anchoReal + 'px';
            clon.style.padding = '24px';
            clon.style.borderRadius = '8px';
            clon.style.backgroundColor = '#0b0f19';
            clon.style.zIndex = '-1';
            clon.style.overflow = 'visible';

            document.body.appendChild(clon);
            return clon;
        }

        async function capturarElemento(elemento, nombreArchivo, boton) {
            const textoOriginal = boton.innerHTML;
            boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Generando...</span>';
            boton.disabled = true;

            try {
                const imgs = elemento.querySelectorAll('img');
                await Promise.all(Array.from(imgs).map(img => {
                    if (img.complete) return Promise.resolve();
                    return new Promise(r => {
                        img.addEventListener('load', r, { once: true });
                        img.addEventListener('error', r, { once: true });
                    });
                }));

                await new Promise(r => setTimeout(r, 100));

                const anchoReal = 900;
                const clon = await prepararClon(elemento, anchoReal);

                const canvas = await html2canvas(clon, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#0b0f19',
                    logging: false,
                    width: anchoReal,
                    height: clon.scrollHeight,
                    windowWidth: anchoReal,
                    windowHeight: clon.scrollHeight
                });

                document.body.removeChild(clon);

                const enlace = document.createElement('a');
                enlace.download = nombreArchivo;
                enlace.href = canvas.toDataURL('image/png');
                enlace.click();

            } catch (error) {
                console.error('Error al generar la captura:', error);
                alert('Hubo un error al generar la captura.');
            } finally {
                boton.innerHTML = textoOriginal;
                boton.disabled = false;
            }
        }

        async function descargarCategoria(catId, catNombre) {
            const elemento = document.getElementById('seccion-' + catId);
            if (!elemento) return;
            const boton = elemento.querySelector('.btn-capture-cat');
            await capturarElemento(elemento, `DarkUnity-Ranking-${catNombre}.png`, boton);
        }

        async function descargarRankingCompleto() {
            const boton = document.querySelector('.btn-download-all');
            const textoOriginal = boton.innerHTML;
            boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...';
            boton.disabled = true;

            try {
                const temp = document.createElement('div');
                temp.style.position = 'fixed';
                temp.style.left = '-99999px';
                temp.style.top = '0';
                temp.style.padding = '30px';
                temp.style.backgroundColor = '#0b0f19';
                temp.style.width = '900px';

                const encabezado = document.createElement('div');
                encabezado.innerHTML = `
                    <h2 style="color: #00e5ff; text-align: center; font-size: 2.2rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px;">RANKING COMPETITIVO SEMANAL 🏆</h2>
                    <p style="color: #94a3b8; text-align: center; margin-bottom: 30px;">Tabla de posiciones oficial | Dark Unity eSports</p>
                `;
                temp.appendChild(encabezado);

                ['rocky', 'beginner', 'master'].forEach(catId => {
                    const seccion = document.getElementById('seccion-' + catId);
                    if (!seccion) return;
                    const clon = seccion.cloneNode(true);
                    const btn = clon.querySelector('.btn-capture-cat');
                    if (btn) btn.remove();
                    temp.appendChild(clon);
                });

                document.body.appendChild(temp);
                await new Promise(r => setTimeout(r, 200));

                try {
                    const bgBase64 = await urlABase64('FONDO-MARCADOR.jpg');
                    temp.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.50), rgba(11, 15, 25, 0.65)), url('${bgBase64}')`;
                    temp.style.backgroundSize = 'cover';
                    temp.style.backgroundPosition = 'center';
                } catch (e) {}

                temp.querySelectorAll('.tabla-container').forEach(tc => { tc.style.overflow = 'visible'; });
                temp.querySelectorAll('table').forEach(t => { t.style.minWidth = 'auto'; t.style.width = '100%'; });

                const canvas = await html2canvas(temp, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#0b0f19',
                    logging: false,
                    width: 900,
                    height: temp.scrollHeight,
                    windowWidth: 900,
                    windowHeight: temp.scrollHeight
                });

                document.body.removeChild(temp);

                const enlace = document.createElement('a');
                enlace.download = 'DarkUnity-Ranking-Completo.png';
                enlace.href = canvas.toDataURL('image/png');
                enlace.click();

            } catch (error) {
                console.error('Error al generar la captura completa:', error);
                alert('Hubo un error al generar la captura completa.');
            } finally {
                boton.innerHTML = textoOriginal;
                boton.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", cargarRankingDinamico);
    </script>
</body>
</html>
