<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo y Agenda - Dark Unity eSports</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --text-white: #f3f4f6;
            --accent-blue: #38bdf8;
            --accent-blue-dark: #1e3a8a;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-border: rgba(56, 189, 248, 0.3);
            --host-red: #ef4444;
            --away-blue: #3b82f6;

            --day-lunes: #38bdf8;
            --day-martes: #facc15;
            --day-miercoles: #fb923c;
            --day-jueves: #c084fc;
            --day-viernes: #ef4444;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(11, 15, 25, 0.50), rgba(11, 15, 25, 0.65)),
                url('FONDO-MARCADOR.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-white);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 15px;
        }

        h1, h2, h3 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-white);
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-volver:hover {
            background-color: var(--accent-blue);
            color: var(--bg-deep);
        }

        .btn-admin-login {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.5);
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        
        .btn-admin-login:hover {
            color: white;
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: var(--accent-blue);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card h2 {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue-dark);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Panel de Administrador */
        #adminPanel {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px dashed var(--accent-blue);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn-sortear {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 5px;
        }

        .btn-sortear:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-eliminar-sorteo {
            background: linear-gradient(135deg, #7f1d1d, #dc2626);
            margin-top: 10px;
        }

        /* GRILLA DE DIAS */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .day-box {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .day-header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .day-date-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #cbd5e1;
            font-size: 0.72rem;
            padding: 4px 6px;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
            outline: none;
            width: 82px;
            text-align: center;
            justify-self: start;
        }

        .day-title {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 1px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-align: center;
            justify-self: center;
        }

        .day-lunes { color: var(--day-lunes); }
        .day-martes { color: var(--day-martes); }
        .day-miercoles { color: var(--day-miercoles); }
        .day-jueves { color: var(--day-jueves); }
        .day-viernes { color: var(--day-viernes); }

        .match-card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
        }

        .team-side {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .team-side.host { text-align: left; }
        .team-side.away { text-align: right; }

        .role-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 3px;
        }

        .role-label.host-lbl { color: var(--host-red); }
        .role-label.away-lbl { color: var(--away-blue); }

        .team-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-white);
            word-break: break-word;
            line-height: 1.15;
        }

        .vs-badge {
            background: rgba(30, 58, 138, 0.6);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            flex-shrink: 0;
        }

        .bye-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed #eab308;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: #fde047;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
            <button class="btn-admin-login" onclick="verificarAdmin()"><i class="fa-solid fa-lock"></i> Admin</button>
        </div>
        
        <header>
            <h1>Sorteo y Agenda</h1>
            <p>Calendario oficial de enfrentamientos semanales de la liga.</p>
        </header>

        <!-- PANEL DE ADMIN -->
        <div id="adminPanel">
            <h3 style="color: var(--accent-blue); margin-top:0; font-size: 1rem;"><i class="fa-solid fa-shield-halved"></i> Panel de Control del Administrador</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">Gestiona los cruces de la semana para todos los usuarios de la web.</p>
            
            <button class="btn-sortear" onclick="ejecutarSorteoAdmin()"><i class="fa-solid fa-shuffle"></i> Generar Nuevo Sorteo Semanal</button>
            <button class="btn-sortear btn-eliminar-sorteo" onclick="borrarSorteoAdmin()"><i class="fa-solid fa-trash-can"></i> Eliminar Sorteo Actual</button>
        </div>

        <!-- SECCIÓN DE CALENDARIO SEMANAL -->
        <section class="card">
            <h2><i class="fa-solid fa-calendar-check"></i> Cruces Oficiales de la Semana</h2>
            
            <div class="days-grid" id="contenedorResultados">
                <!-- Se cargará automáticamente al abrir la página -->
            </div>
        </section>
    </div>

    <script>
        const equiposEjemplo = [
            "Emperium Academy", "Blackvenom", "Storm Born", 
            "Sks Leyahl", "Last Respawn", "Adromeda", 
            "Leones Esport", "Stellaris"
        ];

        const PASSWORD_ADMIN = "*+C4r13w1s121198~";

        function verificarAdmin() {
            let pass = prompt("Ingresa la contraseña de administrador:");
            if (pass === PASSWORD_ADMIN) {
                document.getElementById('adminPanel').style.display = 'block';
                alert("¡Acceso concedido! Ya puedes gestionar el sorteo.");
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function ejecutarSorteoAdmin() {
            let equipos = [...equiposEjemplo];
            let diasConfig = [
                { nombre: 'Lunes', clase: 'day-lunes', fechaDefault: '12/10' },
                { nombre: 'Martes', clase: 'day-martes', fechaDefault: '13/10' },
                { nombre: 'Miércoles', clase: 'day-miercoles', fechaDefault: '14/10' },
                { nombre: 'Jueves', clase: 'day-jueves', fechaDefault: '15/10' },
                { nombre: 'Viernes', clase: 'day-viernes', fechaDefault: '16/10' }
            ];

            let estructuraSemana = [];

            diasConfig.forEach((diaObj) => {
                let eqMezclados = [...equipos];
                for (let i = eqMezclados.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [eqMezclados[i], eqMezclados[j]] = [eqMezclados[j], eqMezclados[i]];
                }

                let matchesDelDia = [];
                for (let i = 0; i < eqMezclados.length - 1; i += 2) {
                    matchesDelDia.push({ host: eqMezclados[i], away: eqMezclados[i+1] });
                }

                let descanso = eqMezclados.length % 2 !== 0 ? eqMezclados[eqMezclados.length - 1] : null;

                estructuraSemana.push({
                    nombre: diaObj.nombre,
                    clase: diaObj.clase,
                    fecha: diaObj.fechaDefault,
                    matches: matchesDelDia,
                    descansa: descanso
                });
            });

            localStorage.setItem('darkUnityCalendario', JSON.stringify(estructuraSemana));
            renderizarCalendario(estructuraSemana);
            alert("¡Sorteo generado y guardado con éxito!");
        }

        function borrarSorteoAdmin() {
            if (confirm("¿Estás seguro de eliminar el sorteo actual? La pantalla volverá a mostrar que aún no hay sorteo.")) {
                localStorage.removeItem('darkUnityCalendario');
                location.reload();
            }
        }

        function renderizarCalendario(semanaData) {
            let contenedor = document.getElementById('contenedorResultados');
            contenedor.innerHTML = '';

            semanaData.forEach((dia, index) => {
                let dayDiv = document.createElement('div');
                dayDiv.className = 'day-box';
                
                let matchesHtml = '';
                dia.matches.forEach(m => {
                    matchesHtml += `
                        <div class="match-card">
                            <div class="team-side host">
                                <span class="role-label host-lbl">HOST</span>
                                <span class="team-name">${m.host}</span>
                            </div>
                            <div class="vs-badge">VS</div>
                            <div class="team-side away">
                                <span class="role-label away-lbl">AWAY</span>
                                <span class="team-name">${m.away}</span>
                            </div>
                        </div>
                    `;
                });

                if (dia.descansa) {
                    matchesHtml += `
                        <div class="bye-card">
                            <i class="fa-solid fa-triangle-exclamation"></i> ${dia.descansa} descansa hoy
                        </div>
                    `;
                }

                dayDiv.innerHTML = `
                    <div class="day-header-container">
                        <input type="text" class="day-date-input" value="${dia.fecha}" placeholder="DD/MM" onchange="actualizarFecha(${index}, this.value)">
                        <h3 class="day-title ${dia.clase}">${dia.nombre}</h3>
                        <div></div>
                    </div>
                    ${matchesHtml}
                `;
                contenedor.appendChild(dayDiv);
            });
        }

        function actualizarFecha(diaIndex, nuevaFecha) {
            let datosGuardados = localStorage.getItem('darkUnityCalendario');
            if (datosGuardados) {
                let semanaData = JSON.parse(datosGuardados);
                semanaData[diaIndex].fecha = nuevaFecha;
                localStorage.setItem('darkUnityCalendario', JSON.stringify(semanaData));
            }
        }

        window.onload = function() {
            let datosGuardados = localStorage.getItem('darkUnityCalendario');
            if (datosGuardados) {
                renderizarCalendario(JSON.parse(datosGuardados));
            } else {
                document.getElementById('contenedorResultados').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 30px;">
                        <i class="fa-solid fa-hourglass-start" style="font-size: 2rem; margin-bottom: 10px; color: var(--accent-blue);"></i>
                        <p>El administrador aún no ha generado el sorteo de los cruces para esta semana.</p>
                    </div>
                `;
            }
        };
    </script>

</body>
</html>
